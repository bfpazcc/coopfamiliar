services:

1. Tu Base de Datos Nativa de Render

type: psql
name: coopfamiliar-db
plan: free

2. Tu Servidor Web (que sirve la API y la interfaz React)

type: web
name: coopfamiliar-app
env: node
plan: free
buildCommand: npm install && npm run build
startCommand: node server.js
envVars:

key: DATABASE_URL
fromDatabase:
name: coopfamiliar-db
property: connectionString