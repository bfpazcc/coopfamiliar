databases:
  - name: coopfamiliar-db
    plan: free

services:
  - type: web
    name: coopfamiliar-app
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: coopfamiliar-db
          property: connectionString